# ELECTRON — FIRA Autonomous Mobile Robotics
# GitHub Pages static deployment workflow via GitHub Actions.

name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Static Site
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages_check.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage static website files
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml .nojekyll _site/
          cp -r css js assets _site/
          test -f _site/index.html
          test -f _site/css/style.css
          test -f _site/js/app.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Verify GitHub Pages configuration
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled for ${{ github.repository }}."
          elif gh api -X POST "repos/${{ github.repository }}/pages" -f build_type="workflow" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages automatically enabled with build_type=workflow."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages Activation Required"
              echo ""
              echo "The static site artifact was built and uploaded successfully, but the GitHub Pages endpoint returned \`404 Not Found\` because Pages is not yet active on \`${{ github.repository }}\`."
              echo ""
              echo "**To activate deployment via GitHub Actions:**"
              echo "1. Open **Settings → Pages** in this repository."
              echo "2. Under **Build and deployment → Source**, select **GitHub Actions**."
              echo "   *(Note: On GitHub Free accounts, GitHub Pages requires the repository to be Public, or a GitHub Pro / Education plan for Private repositories.)*"
              echo "3. Re-run this workflow from the **Actions** tab."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GitHub Pages Not Yet Active::Go to Settings -> Pages -> Build and deployment -> Source and select 'GitHub Actions', then re-run this workflow."
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
