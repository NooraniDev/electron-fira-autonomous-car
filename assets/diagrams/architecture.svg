<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="arch-svg-title arch-svg-desc">
    <title id="arch-svg-title">ELECTRON — High-Level Conceptual System Architecture</title>
    <desc id="arch-svg-desc">Conceptual data flow from Camera and Sensing through the Raspberry Pi 5 (Image Processing and Decision-Making) to the Arduino Uno Embedded Control and Actuation, supported by the Li-ion Battery and DC-DC Voltage Regulation power subsystem.</desc>
    <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e2735" stroke-width="0.75" opacity="0.55"/>
        </pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa"/>
        </marker>
        <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b96a6"/>
        </marker>
    </defs>

    <!-- Background -->
    <rect width="1120" height="420" rx="16" fill="#0b1220"/>
    <rect width="1120" height="420" rx="16" fill="url(#grid)"/>
    <rect x="1" y="1" width="1118" height="418" rx="15" fill="none" stroke="#1e2735" stroke-width="2"/>

    <!-- Header label -->
    <g font-family="Inter, Segoe UI, Arial, sans-serif">
        <text x="36" y="42" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="2">ELECTRON · CONCEPTUAL SYSTEM ARCHITECTURE</text>
        <text x="1084" y="42" text-anchor="end" fill="#8b96a6" font-size="11">FIRA AUTONOMOUS MOBILE ROBOTICS</text>
    </g>

    <!-- Main Computing Platform Enclosure (Raspberry Pi 5) -->
    <rect x="268" y="66" width="424" height="196" rx="12" fill="#111826" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="288" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1.4">MAIN COMPUTING PLATFORM · RASPBERRY PI 5 (16 GB)</text>

    <!-- Stage 01: Camera & Sensing -->
    <g transform="translate(36, 108)" font-family="Inter, Segoe UI, Arial, sans-serif">
        <rect width="196" height="136" rx="10" fill="#111826" stroke="#2a3546" stroke-width="1.5"/>
        <text x="18" y="28" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1.2">01 · PERCEPTION INPUT</text>
        <text x="18" y="54" fill="#f5f7fa" font-size="15" font-weight="700">Camera &amp; Sensing</text>
        <text x="18" y="78" fill="#8b96a6" font-size="12">Captures visual stream</text>
        <text x="18" y="96" fill="#8b96a6" font-size="12">&amp; obstacle proximity</text>
        <rect x="18" y="106" width="160" height="20" rx="4" fill="#162238"/>
        <text x="26" y="120" fill="#60a5fa" font-size="10.5" font-weight="600">Pi Camera · Obstacle Sensor</text>
    </g>

    <!-- Stage 02: Image Processing -->
    <g transform="translate(286, 108)" font-family="Inter, Segoe UI, Arial, sans-serif">
        <rect width="186" height="136" rx="10" fill="#161e2d" stroke="#2a3546" stroke-width="1.5"/>
        <text x="18" y="28" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1.2">02 · VISION</text>
        <text x="18" y="54" fill="#f5f7fa" font-size="15" font-weight="700">Image Processing</text>
        <text x="18" y="78" fill="#8b96a6" font-size="12">Frame preprocessing,</text>
        <text x="18" y="96" fill="#8b96a6" font-size="12">AprilTag &amp; object detection</text>
        <rect x="18" y="106" width="150" height="20" rx="4" fill="#162238"/>
        <text x="26" y="120" fill="#60a5fa" font-size="10.5" font-weight="600">Python · OpenCV · YOLO</text>
    </g>

    <!-- Stage 03: Decision-Making -->
    <g transform="translate(494, 108)" font-family="Inter, Segoe UI, Arial, sans-serif">
        <rect width="180" height="136" rx="10" fill="#161e2d" stroke="#2a3546" stroke-width="1.5"/>
        <text x="18" y="28" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1.2">03 · AUTONOMY</text>
        <text x="18" y="54" fill="#f5f7fa" font-size="15" font-weight="700">Decision-Making</text>
        <text x="18" y="78" fill="#8b96a6" font-size="12">Interprets cues &amp; selects</text>
        <text x="18" y="96" fill="#8b96a6" font-size="12">navigation actions</text>
        <rect x="18" y="106" width="144" height="20" rx="4" fill="#162238"/>
        <text x="26" y="120" fill="#60a5fa" font-size="10.5" font-weight="600">High-Level Navigation</text>
    </g>

    <!-- Stage 04: Embedded Control -->
    <g transform="translate(728, 108)" font-family="Inter, Segoe UI, Arial, sans-serif">
        <rect width="170" height="136" rx="10" fill="#111826" stroke="#2a3546" stroke-width="1.5"/>
        <text x="18" y="28" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1.2">04 · CONTROL</text>
        <text x="18" y="54" fill="#f5f7fa" font-size="15" font-weight="700">Embedded Control</text>
        <text x="18" y="78" fill="#8b96a6" font-size="12">Real-time deterministic</text>
        <text x="18" y="96" fill="#8b96a6" font-size="12">control signals</text>
        <rect x="18" y="106" width="134" height="20" rx="4" fill="#162238"/>
        <text x="26" y="120" fill="#60a5fa" font-size="10.5" font-weight="600">Arduino Uno</text>
    </g>

    <!-- Stage 05: Actuation -->
    <g transform="translate(928, 108)" font-family="Inter, Segoe UI, Arial, sans-serif">
        <rect width="156" height="136" rx="10" fill="#111826" stroke="#2a3546" stroke-width="1.5"/>
        <text x="18" y="28" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1.2">05 · MOTION</text>
        <text x="18" y="54" fill="#f5f7fa" font-size="15" font-weight="700">Actuation</text>
        <text x="18" y="78" fill="#8b96a6" font-size="12">Propulsion, speed</text>
        <text x="18" y="96" fill="#8b96a6" font-size="12">&amp; angular positioning</text>
        <rect x="18" y="106" width="120" height="20" rx="4" fill="#162238"/>
        <text x="26" y="120" fill="#60a5fa" font-size="10.5" font-weight="600">L298 · Servo Motor</text>
    </g>

    <!-- Flow Connectors -->
    <g stroke="#60a5fa" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
        <line x1="232" y1="176" x2="282" y2="176"/>
        <line x1="472" y1="176" x2="490" y2="176"/>
        <line x1="674" y1="176" x2="724" y2="176"/>
        <line x1="898" y1="176" x2="924" y2="176"/>
    </g>

    <!-- Closed perception-action loop -->
    <path d="M 1006 244 L 1006 286 L 134 286 L 134 248" fill="none" stroke="#8b96a6" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow-muted)"/>
    <rect x="380" y="274" width="360" height="22" rx="11" fill="#0b1220" stroke="#2a3546"/>
    <text x="560" y="289" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" fill="#c9d1dc" font-size="11">Closed perception–action loop through the environment</text>

    <!-- Power Subsystem Bar -->
    <g transform="translate(36, 322)" font-family="Inter, Segoe UI, Arial, sans-serif">
        <rect width="1048" height="66" rx="10" fill="#111826" stroke="#c9a54c" stroke-opacity="0.55" stroke-width="1.5"/>
        <text x="24" y="28" fill="#c9a54c" font-size="11" font-weight="700" letter-spacing="1.4">POWER SUBSYSTEM · LI-ION BATTERY SYSTEM + DC-DC VOLTAGE REGULATION</text>
        <text x="24" y="48" fill="#8b96a6" font-size="12">Supplies regulated onboard energy to computing, sensing, embedded control, and motor actuation stages.</text>
        <text x="1024" y="40" text-anchor="end" fill="#8b96a6" font-size="11">Conceptual overview — proprietary details omitted</text>
    </g>
</svg>
